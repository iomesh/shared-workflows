# Multi-provider Claude Code workflow. Despite the filename (kept so existing
# `uses: ...claude-bedrock.yml@main` references don't break), it supports:
#   - fireworks (default): GLM-5.3 via Fireworks' Anthropic-compatible endpoint
#   - bedrock:             Claude via Amazon Bedrock
name: Claude Code

on:
  workflow_call:
    inputs:
      provider:
        description: "Inference provider: fireworks | bedrock"
        type: string
        default: "fireworks"
      model:
        description: "Model ID; empty = provider default (fireworks: accounts/fireworks/models/glm-5p3, bedrock: global.anthropic.claude-sonnet-4-6)"
        type: string
        default: ""
      max_turns:
        description: "Max conversation turns"
        type: string
        default: "100"
      aws_region:
        description: "AWS region for Bedrock (bedrock provider only)"
        type: string
        default: "ap-southeast-1"
      prompt:
        description: "Prompt for Claude (used for auto-review on PR events)"
        type: string
        default: "Review this PR for code quality, correctness, and potential issues."
      additional_permissions:
        description: "Additional tool permissions"
        type: string
        default: "Bash(*),Edit(*),Write(*)"
      allowed_bots:
        description: "Comma-separated list of bot usernames allowed to trigger"
        type: string
        default: "claude[bot],iomesh-ci-bot[bot]"
      track_progress:
        description: "Show progress tracking"
        type: string
        default: "true"
    secrets:
      AWS_BEARER_TOKEN_BEDROCK:
        required: false
      FIREWORKS_API_KEY:
        required: false

jobs:
  claude:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve provider defaults
        id: cfg
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
        run: |
          case "$PROVIDER" in
            fireworks) default_model="accounts/fireworks/models/glm-5p3" ;;
            bedrock)   default_model="global.anthropic.claude-sonnet-4-6" ;;
            *) echo "::error::Unknown provider '$PROVIDER' (expected: fireworks | bedrock)"; exit 1 ;;
          esac
          echo "model=${MODEL:-$default_model}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: ${{ inputs.provider == 'bedrock' && 'true' || 'false' }}
          # Fireworks accepts the key via the standard x-api-key header, which is
          # how claude-code-action forwards anthropic_api_key.
          anthropic_api_key: ${{ inputs.provider == 'fireworks' && secrets.FIREWORKS_API_KEY || '' }}
          prompt: ${{ inputs.prompt }}
          allowed_bots: ${{ inputs.allowed_bots }}
          additional_permissions: ${{ inputs.additional_permissions }}
          track_progress: ${{ inputs.track_progress }}
          show_full_output: "true"
          claude_args: "--model ${{ steps.cfg.outputs.model }} --max-turns ${{ inputs.max_turns }}"
        env:
          # Unused entries resolve to "" and are ignored (empty is falsy to the CLI).
          AWS_BEARER_TOKEN_BEDROCK: ${{ inputs.provider == 'bedrock' && secrets.AWS_BEARER_TOKEN_BEDROCK || '' }}
          AWS_REGION: ${{ inputs.aws_region }}
          ANTHROPIC_BASE_URL: ${{ inputs.provider == 'fireworks' && 'https://api.fireworks.ai/inference' || '' }}

      # The action reports success even when Claude's run ends with is_error: true
      # (e.g. rate limiting), leaving the PR comment stuck at the placeholder.
      - name: Fail job if Claude execution errored
        if: steps.claude.outputs.execution_file != ''
        run: |
          # NB: don't use `first // true` here — jq's `//` treats `false` as empty,
          # so a successful run (is_error: false) would evaluate to true and fail the job.
          is_error=$(jq -r '[.[] | select(.type == "result") | .is_error] | if length == 0 then "no_result" else (last | tostring) end' "${{ steps.claude.outputs.execution_file }}")
          if [ "$is_error" != "false" ]; then
            echo "::error::Claude execution failed (is_error=$is_error); the PR comment was likely never updated with results. Check the action output above for the underlying API error."
            exit 1
          fi
