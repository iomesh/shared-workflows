name: Claude Code (Bedrock)

on:
  workflow_call:
    inputs:
      model:
        description: "Bedrock model ID"
        type: string
        default: "global.anthropic.claude-sonnet-4-6"
      max_turns:
        description: "Max conversation turns"
        type: string
        default: "100"
      aws_region:
        description: "AWS region for Bedrock"
        type: string
        default: "ap-southeast-1"
      prompt:
        description: "Prompt for Claude (used for auto-review on PR events)"
        type: string
        default: "Review this PR for code quality, correctness, and potential issues."
      additional_permissions:
        description: "Additional tool permissions"
        type: string
        default: "Bash(*),Edit(*),Write(*)"
      allowed_bots:
        description: "Comma-separated list of bot usernames allowed to trigger"
        type: string
        default: "claude[bot],iomesh-ci-bot[bot]"
      track_progress:
        description: "Show progress tracking"
        type: string
        default: "true"
    secrets:
      AWS_BEARER_TOKEN_BEDROCK:
        required: false

jobs:
  claude:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    # Auto-reviews on the same PR share a concurrency group, so a new push
    # cancels the stale in-flight review instead of burning quota twice.
    # @claude-triggered runs (issue_comment etc.) get a unique group per run
    # and are never cancelled mid-answer.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request'
            && format('claude-review-{0}-{1}', github.repository, github.event.pull_request.number)
            || format('claude-run-{0}', github.run_id) }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          prompt: ${{ inputs.prompt }}
          allowed_bots: ${{ inputs.allowed_bots }}
          additional_permissions: ${{ inputs.additional_permissions }}
          track_progress: ${{ inputs.track_progress }}
          show_full_output: "true"
          claude_args: "--model ${{ inputs.model }} --max-turns ${{ inputs.max_turns }}"
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ inputs.aws_region }}

      # The action reports success even when Claude's run ends with is_error: true
      # (e.g. Bedrock throttling), leaving the PR comment stuck at the placeholder.
      - name: Fail job if Claude execution errored
        if: steps.claude.outputs.execution_file != ''
        run: |
          # NB: don't use `first // true` here — jq's `//` treats `false` as empty,
          # so a successful run (is_error: false) would evaluate to true and fail the job.
          is_error=$(jq -r '[.[] | select(.type == "result") | .is_error] | if length == 0 then "no_result" else (last | tostring) end' "${{ steps.claude.outputs.execution_file }}")
          if [ "$is_error" != "false" ]; then
            echo "::error::Claude execution failed (is_error=$is_error); the PR comment was likely never updated with results. Check the action output above for the underlying API error."
            exit 1
          fi
